# Pwn4C sysupgrade.conf
# Files listed here are preserved across sysupgrade (copied to RAM before flash
# write and restored afterward).  Only drone-specific files are listed; OpenWrt
# automatically preserves its own overlay-listed paths (/etc/config/*).
#
# Format: one path per line. Directories are preserved recursively.
# See: https://openwrt.org/docs/guide-user/backup/backed_up_files
#
# ── SSH identity ──────────────────────────────────────────────────────────────
/etc/dropbear/authorized_keys
/etc/dropbear/dropbear_rsa_host_key
/etc/dropbear/dropbear_ed25519_host_key
#
# ── UCI configuration ─────────────────────────────────────────────────────────
# /etc/config/ is already preserved by the default OpenWrt sysupgrade list.
# We add our overlay here as an explicit safety net:
/etc/config/network
/etc/config/system
/etc/config/dhcp
/etc/config/dropbear
/etc/config/wireless
#
# ── pwn4cd placeholder (populated when daemon is deployed) ───────────────────
# /etc/pwn4cd.conf
