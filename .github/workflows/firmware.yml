name: Drone Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'daemon/**'
      - '.github/workflows/firmware.yml'
      - '.github/actions/setup-sdk/**'
  pull_request:
    paths:
      - 'firmware/**'
      - 'daemon/**'
      - '.github/workflows/firmware.yml'
      - '.github/actions/setup-sdk/**'
  workflow_call:
    # Allows release workflow to trigger firmware build
    inputs:
      daemon-artifact-name:
        description: 'Name of pre-built daemon artifact to use (optional)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint-firmware:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          sh -n firmware/build.sh
          sh -n firmware/build-mt76-kmod.sh
          sh -n firmware/files/etc/init.d/pwn4c-net
          sh -n firmware/files/etc/init.d/pwn4c-radio
          sh -n firmware/files/usr/lib/pwn4c/provision.sh
          sh -n firmware/files/etc/uci-defaults/99-pwn4c

  build-image:
    name: Build OpenWrt Image
    needs: lint-firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file gawk gettext git libncurses-dev libssl-dev \
            python3 rsync unzip wget zlib1g-dev ca-certificates squashfs-tools

      - name: Cache ImageBuilder tree
        uses: actions/cache@v4
        with:
          path: ~/ib-work
          key: imagebuilder-23.05.5-ramips-mt76x8

      # If daemon artifact was passed via workflow_call, download it.
      - name: Download Daemon Artifact (if provided)
        if: ${{ inputs.daemon-artifact-name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.daemon-artifact-name }}
          path: daemon/

      # If no pre-built daemon provided, cross-compile it now
      - name: Setup SDK (if building daemon)
        if: ${{ inputs.daemon-artifact-name == '' }}
        id: sdk
        uses: ./.github/actions/setup-sdk

      - name: Cross-compile daemon (if needed)
        if: ${{ inputs.daemon-artifact-name == '' }}
        run: make -C daemon cross SDK_DIR="${{ steps.sdk.outputs.sdk-dir }}"

      - name: Verify daemon binary
        run: |
          file daemon/pwn4cd-mips | grep -q MIPS
          echo "Daemon binary verified."

      - name: Build Firmware
        run: |
          mkdir -p ~/ib-work dist
          WORK_DIR="$HOME/ib-work" OUT_DIR="$GITHUB_WORKSPACE/dist" \
            PWN4CD_BIN="$GITHUB_WORKSPACE/daemon/pwn4cd-mips" sh firmware/build.sh

      - name: Assert daemon + provisioning baked into image
        run: |
          SQ=$(ls ~/ib-work/openwrt-imagebuilder-*/build_dir/target-*/linux-*/root.squashfs | head -n 1)
          rm -rf /tmp/rootfs && mkdir -p /tmp/rootfs
          unsquashfs -d /tmp/rootfs "$SQ" etc usr
          test -x /tmp/rootfs/usr/sbin/pwn4cd
          test -f /tmp/rootfs/etc/init.d/pwn4cd
          file /tmp/rootfs/usr/sbin/pwn4cd | grep -q MIPS
          # First-boot resilience: the repair script, the shared provisioning
          # file and the rc.d symlinks must be in the squashfs, not only in the
          # overlay that uci-defaults writes on first boot.
          test -x /tmp/rootfs/etc/init.d/pwn4c-net
          test -f /tmp/rootfs/usr/lib/pwn4c/provision.sh
          test -f /tmp/rootfs/etc/uci-defaults/99-pwn4c
          for link in S19pwn4c-net S21pwn4c-radio S95pwn4cd; do
            test -L "/tmp/rootfs/etc/rc.d/$link" || { echo "missing rc.d symlink $link"; exit 1; }
            test -e "/tmp/rootfs/etc/rc.d/$link" || { echo "dangling rc.d symlink $link"; exit 1; }
          done
          echo "Daemon + first-boot provisioning verified inside root.squashfs!"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwn4c-firmware-sysupgrade
          path: dist/
          retention-days: 14
