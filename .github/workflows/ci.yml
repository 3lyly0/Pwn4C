name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go (fmt, vet, build, test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - {os: ubuntu-latest, bin: pwn4c}
          - {os: windows-latest, bin: pwn4c.exe}
          - {os: macos-latest, bin: pwn4c}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          mkdir -p dist
          go build -o "dist/${{ matrix.bin }}" ./cmd/pwn4c

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwn4c-${{ matrix.os }}
          path: dist/
          retention-days: 30

      - name: Test
        run: go test ./...

  shell:
    name: Shell syntax (firmware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check build.sh syntax
        run: sh -n firmware/build.sh
