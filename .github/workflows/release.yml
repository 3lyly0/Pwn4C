name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Build CLI tool for all supported platforms
  build-cli:
    name: Build CLI Binaries
    uses: ./.github/workflows/cli.yml

  # 2. Build daemon (MIPS static binary)
  build-daemon:
    name: Build Daemon Binary
    uses: ./.github/workflows/daemon.yml

  # 3. Build firmware image
  build-firmware:
    name: Build Firmware Image
    uses: ./.github/workflows/firmware.yml

  # 4. Collect all 3 components and publish GitHub Release
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-cli, build-daemon, build-firmware]
    steps:
      - uses: actions/checkout@v4

      - name: Create release directory
        run: mkdir -p release-dist

      # Download CLI binaries
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pwn4c-*
          path: release-dist/
          merge-multiple: true

      # Download daemon standalone binary
      - name: Download Daemon artifact
        uses: actions/download-artifact@v4
        with:
          name: pwn4cd-mips
          path: release-dist/

      # Download drone firmware image
      - name: Download Firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: pwn4c-firmware-sysupgrade
          path: release-dist/
          merge-multiple: true

      # Compute SHA256 checksums for all release assets
      - name: Generate Checksums
        run: |
          cd release-dist
          rm -f checksums.sha256
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > RELEASE_NOTE.md
          ### 📦 Pwn4C Modular Release

          This release provides the 3 decoupled components of the Pwn4C ecosystem:

          | Component | File | Description |
          |---|---|---|
          | **Operator CLI** | `pwn4c-linux-amd64`, `pwn4c-windows-amd64.exe`, `pwn4c-darwin-amd64` | Host orchestrator & control tool |
          | **Implant Daemon** | `pwn4cd-mips` | Standalone MIPS static binary (for OTA/SSH drone updates) |
          | **Drone Firmware** | `pwn4c-firmware-mi4c-sysupgrade.bin` | Full OpenWrt sysupgrade image with daemon pre-baked |
          EOF

          if [[ "${{ github.ref_name }}" == *beta* ]]; then
            echo "" >> RELEASE_NOTE.md
            echo "> [!WARNING]" >> RELEASE_NOTE.md
            echo "> **Beta Build** — for testing and evaluation purposes." >> RELEASE_NOTE.md
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          body_path: RELEASE_NOTE.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
