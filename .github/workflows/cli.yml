name: CLI Tool

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cli.yml'
  workflow_call:
    # Allows release or other workflows to trigger CLI build directly

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          DIFF=$(gofmt -l .)
          if [ -n "$DIFF" ]; then
            echo "[ERROR] Unformatted Go files found:"
            echo "$DIFF"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

  build-matrix:
    name: Build CLI (${{ matrix.os }})
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        include:
          # GOOS/GOARCH are set explicitly below: relying on the runner's host
          # defaults produced a darwin/arm64 binary on macos-latest and left the
          # linux build missing from the release. `out` is unique per entry so
          # merge-multiple in release.yml cannot overwrite one build with another.
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64, out: pwn4c-linux-amd64 }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64, out: pwn4c-linux-arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64, out: pwn4c-windows-amd64.exe }
          - { os: macos-latest,   goos: darwin,  goarch: amd64, out: pwn4c-darwin-amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: arm64, out: pwn4c-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          # Tags give a clean version; branch builds get a dev marker so a
          # released binary is always distinguishable from a CI snapshot.
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in
            v*) ;;
            *) VERSION="dev-$(git rev-parse --short HEAD)" ;;
          esac
          go build -trimpath -ldflags="-s -w -X github.com/3lyly0/Pwn4C/cmd/pwn4c/cmd.Version=$VERSION" -o "dist/${{ matrix.out }}" ./cmd/pwn4c

      # Cross-compiled binaries cannot be executed on the runner, so verify the
      # target recorded in the binary instead of trusting the matrix entry.
      - name: Verify binary target
        shell: bash
        run: |
          go version -m "dist/${{ matrix.out }}"
          go version -m "dist/${{ matrix.out }}" | grep -q "GOOS=${{ matrix.goos }}"
          go version -m "dist/${{ matrix.out }}" | grep -q "GOARCH=${{ matrix.goarch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwn4c-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.out }}
          retention-days: 14
